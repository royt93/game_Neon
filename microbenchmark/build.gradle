plugins {
    id 'com.android.test'
}
android {
    namespace = "com.tranphuloi.neon.microbenchmark"
    compileSdk = 37
    defaultConfig {
        minSdk = 28
        targetSdk = 37
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // app không có build type non-debuggable dành riêng cho benchmark
        // (androidx.benchmark plugin chỉ support com.android.library) — baseline
        // này đo trên devDebug, chấp nhận sai số do debuggable=true, ghi chú
        // trong doc/task/done/20-microbenchmark-module.md.
        testInstrumentationRunnerArguments["androidx.benchmark.suppressErrors"] = "DEBUGGABLE"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    targetProjectPath = ":app"
    // Bắt buộc cho macrobenchmark test module (com.android.test): tách tiến
    // trình instrumentation khỏi tiến trình app đo, nếu không sẽ lỗi
    // NOT-SELF-INSTRUMENTING (không thể kill/compile/launch app đang đo).
    experimentalProperties["android.experimental.self-instrumenting"] = true
    flavorDimensions += "type"
    productFlavors {
        dev { dimension "type" }
        production { dimension "type" }
    }
}
dependencies {
    implementation "androidx.test.ext:junit:1.3.0"
    implementation "androidx.test.uiautomator:uiautomator:2.3.0"
    implementation "androidx.benchmark:benchmark-macro-junit4:1.5.0-alpha07"
}
