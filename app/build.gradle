plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.tranphuloi.neon"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.tranphuloi.neon"
        minSdk = 23
        targetSdk = 37
        versionCode = 20260509
        versionName = "2026.05.09"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        resValues = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildTypes.configureEach { crunchPngs = false }

    flavorDimensions.add("type")
    productFlavors {
        register("dev") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A DEV")
        }
        register("production") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A")
        }
    }

    lint {
        // material3 is only on the classpath transitively; source uses Material 1 only.
        disable += "UsingMaterialAndMaterial3Libraries"
        // Asset-quality hints, not code bugs.
        disable += "IconLauncherShape"
        disable += "IconMissingDensityFolder"
        disable += "GifUsage"
        // Fullscreen portrait-locked game; Configuration screen size is sufficient.
        disable += "ConfigurationScreenWidthHeight"
    }
}

dependencies {
    /*Core*/
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    /*Compose (BOM aligns versions)*/
    implementation platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    /*Audio player (Media3, replaces ExoPlayer 2.x)*/
    implementation "androidx.media3:media3-exoplayer:1.10.0"
    implementation "androidx.media3:media3-common:1.10.0"
    /*Image (Coil 3.x)*/
    implementation "io.coil-kt.coil3:coil-compose:3.4.0"
    implementation "io.coil-kt.coil3:coil-gif:3.4.0"
    /*Navigation*/
    implementation "androidx.navigation:navigation-compose:2.9.8"
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}
