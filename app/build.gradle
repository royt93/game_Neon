plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.tranphuloi.neon"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.tranphuloi.neon"
        minSdk = 23
        targetSdk = 37
        versionCode = 20260509
        versionName = "2026.05.09"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        resValues = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildTypes.configureEach { crunchPngs = false }

    flavorDimensions.add("type")
    productFlavors {
        register("dev") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A DEV")
        }
        register("production") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A")
        }
    }

    testOptions {
        unitTests {
            // Stub android.util.Log etc. so Logger calls don't throw in JVM tests.
            returnDefaultValues = true
        }
    }

    lint {
        // material3 is only on the classpath transitively; source uses Material 1 only.
        disable += "UsingMaterialAndMaterial3Libraries"
        // Asset-quality hints, not code bugs.
        disable += "IconLauncherShape"
        disable += "IconMissingDensityFolder"
        disable += "GifUsage"
        // Fullscreen portrait-locked game; Configuration screen size is sufficient.
        disable += "ConfigurationScreenWidthHeight"
    }
}

dependencies {
    /*Core*/
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    /*Compose (BOM aligns versions)*/
    implementation platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    /*Audio player (Media3, replaces ExoPlayer 2.x)*/
    implementation "androidx.media3:media3-exoplayer:1.10.0"
    implementation "androidx.media3:media3-common:1.10.0"
    // Round 72 — Coil 3 deps removed. ExplosionCanvas thay GIF asset Round 72.
    // Nếu future cần Coil cho ảnh remote, re-add.
    /*Navigation*/
    implementation "androidx.navigation:navigation-compose:2.9.8"
    /*Persistence*/
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    /*System splash (Android 12+ API + back-port)*/
    implementation "androidx.core:core-splashscreen:1.0.1"
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
    /*Unit tests (JVM, no Android runtime). Run via `./gradlew test`.*/
    testImplementation "junit:junit:4.13.2"
    /* Wave 11a Phase 5 — widget test infra HALF-SET-UP (compile works, runtime
       fails). Compose UI test needs Robolectric ComponentActivity wired via
       custom test manifest + @Config(application = ...). Future round:
       finalize manifest/config so `runComposeUiTest` resolves Build.FINGERPRINT
       from Robolectric environment. Deps below resolve cleanly — only test
       runtime config is missing. */
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core-ktx:1.6.1"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}
