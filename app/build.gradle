plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
}

android {
    namespace = "com.tranphuloi.neon"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.tranphuloi.neon"
        // Wave 26 (#release) — 23→24: code dùng API 24 (Configuration.getLocales,
        // LocaleList.get, ConcurrentHashMap.merge) → crash trên API 23. minSdk 24
        // gỡ 4 lỗi NewApi; Android 6.0 ~<1% thị phần 2026.
        minSdk = 24
        targetSdk = 37
        versionCode = 20260705
        versionName = "2026.07.05"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        resValues = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Wave 25d (#6 ship-readiness) — wire release signing qua keystore.properties
    // (root, ĐÃ COMMIT vào git có chủ đích — private repo, xem comment trong
    // chính keystore.properties). Vắng file → release để UNSIGNED như cũ
    // (dev/CI vẫn build được).
    def keystorePropsFile = rootProject.file("keystore.properties")
    def hasReleaseKeystore = keystorePropsFile.exists()
    def keystoreProps = new Properties()
    if (hasReleaseKeystore) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        // Luôn khai báo signing config "release" để tránh lỗi Gradle configuration khi truy vấn
        release {
            if (hasReleaseKeystore &&
                keystoreProps.getProperty("storePassword") &&
                keystoreProps.getProperty("keyAlias") &&
                keystoreProps.getProperty("keyPassword")) {
                
                storeFile = file(keystoreProps.getProperty("storeFile", "keystore.jks"))
                storePassword = keystoreProps.getProperty("storePassword")
                keyAlias = keystoreProps.getProperty("keyAlias")
                keyPassword = keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Ký release chỉ khi các cấu hình keystore được điền đầy đủ
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storePassword != null) {
                signingConfig = signingConfigs.release
            }
        }
    }
    buildTypes.configureEach { crunchPngs = false }

    flavorDimensions.add("type")
    productFlavors {
        register("dev") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A DEV")
        }
        register("production") {
            dimension = "type"
            resValue("string", "app_name", "Sky force U*S*A")
        }
    }

    testOptions {
        unitTests {
            // Stub android.util.Log etc. so Logger calls don't throw in JVM tests.
            returnDefaultValues = true
        }
    }

    lint {
        // material3 is only on the classpath transitively; source uses Material 1 only.
        disable += "UsingMaterialAndMaterial3Libraries"
        // Asset-quality hints, not code bugs.
        disable += "IconLauncherShape"
        disable += "IconMissingDensityFolder"
        disable += "GifUsage"
        // Fullscreen portrait-locked game; Configuration screen size is sufficient.
        disable += "ConfigurationScreenWidthHeight"
    }
}

dependencies {
    /*Core*/
    implementation "androidx.core:core-ktx:1.18.0"
    // Task 11 (đợt 3) — cài baseline profile (src/main/baseline-prof.txt) lúc chạy
    // đầu để giảm jank cold-start. AGP tự merge profile vào APK; lib này install nó
    // trên API 24-30 (API 31+ nền tảng tự dùng). Không phụ thuộc AGP nên an toàn.
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    baselineProfile project(":baselineprofile")
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    /*Compose (BOM aligns versions)*/
    implementation platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    /*Audio player (Media3, replaces ExoPlayer 2.x)*/
    implementation "androidx.media3:media3-exoplayer:1.10.0"
    implementation "androidx.media3:media3-common:1.10.0"
    // Round 72 — Coil 3 deps removed. ExplosionCanvas thay GIF asset Round 72.
    // Nếu future cần Coil cho ảnh remote, re-add.
    /*Navigation*/
    implementation "androidx.navigation:navigation-compose:2.9.8"
    /*Persistence*/
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    /*System splash (Android 12+ API + back-port)*/
    implementation "androidx.core:core-splashscreen:1.0.1"
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
    /*Unit tests (JVM, no Android runtime). Run via `./gradlew test`.*/
    testImplementation "junit:junit:4.13.2"
    /* Robolectric giữ lại cho integration test THUẦN DataStore (không Compose),
       vd MetaProgressionShipIntegrationTest — Robolectric chạy tốt cho các test
       không dùng createComposeRule. Chỉ có Compose UI test (ui-test-junit4) là
       bị bug AGP 9.1.1 (không merge ui-test-manifest vào manifest JVM unit-test
       → createComposeRule() ném RuntimeException, Robolectric PR #4736) nên được
       chuyển hẳn sang route androidTest thật bên dưới. */
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core-ktx:1.6.1"
    /* Widget + integration tests (androidTest, Compose UI thật trên thiết bị/
       emulator). createAndroidComposeRule<MainActivity>() chạy qua
       `./gradlew connectedDevDebugAndroidTest`. */
    // Compose BOM cũng phải áp cho classpath androidTest để ui-test-junit4 lấy
    // được version (BOM khai ở implementation không tự lan sang androidTest).
    androidTestImplementation platform("androidx.compose:compose-bom:$compose_bom_version")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    // androidx.test 1.7.0 / espresso 3.7.0: dùng InputManagerGlobal thay cho
    // reflection InputManager.getInstance() (đã bị xoá từ Android 15+/API 35).
    // Bản 3.6.x ném NoSuchMethodException trên API 37 → hỏng MỌI Compose test vì
    // compose-ui-test gọi Espresso.onIdle() để đồng bộ. Đừng hạ version.
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    /* UiAutomator lái UI THẬT cho các flow test qua MainActivity+NavHost. Lý do:
       compose-ui-test dispatch LaunchedEffect off-main (frame-deferring pool),
       mà SplashScreen tự điều hướng NGAY trong LaunchedEffect → navController
       chạm setCurrentState off-main → crash trên Android 17. UiAutomator không
       thay dispatcher của app → effect chạy trên main như production → hết crash.
       Compose test rule vẫn dùng cho widget test cô lập (không auto-navigate). */
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    // ui-test-manifest cung cấp activity stub cho ComposeTestRule; cần trên
    // classpath debug (androidTest chạy trên debug build).
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}
